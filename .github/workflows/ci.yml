name: Integración continua

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Mostrar versión de .NET
        run: dotnet --info

      - name: Restaurar dependencias
        run: dotnet restore ./Licitaciones.sln

      - name: Compilar en Release
        run: dotnet build ./Licitaciones.sln --configuration Release --no-restore

      - name: Verificar Docker para Testcontainers
        run: docker version

      - name: Instalar Chromium para Playwright
        timeout-minutes: 10
        run: >-
          pwsh
          ./tests/Licitaciones.EndToEndTests/bin/Release/net9.0/playwright.ps1
          install --with-deps chromium

      - name: Ejecutar todas las pruebas
        env:
          E2E_ARTIFACTS_PATH: ${{ github.workspace }}/TestResults/e2e
        run: >-
          dotnet test ./Licitaciones.sln
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory ./TestResults

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            TestResults/**/*.trx
            TestResults/e2e/**
          if-no-files-found: warn
          retention-days: 7
